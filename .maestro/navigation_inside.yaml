appId: com.navipet.navipet
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Mock navigation verification"
    timeout: 30000
- tapOn: "Inside"
- setLocation:
    latitude: 33.784121
    longitude: -118.116040
- startRecording: navigation-inside
- tapOn: "Where to?"
- inputText: "business"
- tapOn:
    text: "Continue"
    optional: true
- tapOn: ".*College of Business.*"
- assertVisible: "Directions"
- tapOn: "Directions"
- tapOn: "Start route"
- extendedWaitUntil:
    visible: "State: arrived; route requests: 0"
    timeout: 15000
- assertVisible: "Return to map"
- assertNotVisible: "You're already here"
- takeScreenshot: inside-direct-arrival
- stopRecording
